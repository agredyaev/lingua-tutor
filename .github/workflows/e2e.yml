name: e2e

# Browser suite (12-testing.md §7): out of the default PR gate; runs on main
# pushes and manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: build web
        working-directory: apps/web
        run: trunk build --release --cargo-profile wasm-release
      - name: build native server
        run: cargo build -p lingua-tutor-local --bin lingua-tutor
      - run: npm ci --ignore-scripts
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
