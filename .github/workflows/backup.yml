name: backup

# Daily D1 export (11-infrastructure.md §5): RPO <= 24h; artifacts live in
# the private repo (access-controlled), retention 90 days. No R2/S3 needed.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: export prod D1
        working-directory: apps/worker
        run: |
          npx wrangler d1 export lingua-tutor-prod --remote \
            --output ../../backup-$(date +%Y%m%dT%H%M%S).sql
      - name: dry-run restore (11 §5: validate every backup)
        run: |
          sudo apt-get install -yq sqlite3 >/dev/null
          sqlite3 :memory: ".read $(ls backup-*.sql)" "SELECT count(*) FROM cards;"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 90
