[package]
name = "worker-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Cloudflare Worker serving /api/v1"

[lib]
# rlib: lets integration-tests exercise repository SQL against scratch SQLite.
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { workspace = true }
shared-schema = { workspace = true }
language-pack-api = { workspace = true }
language-pack-registry = { workspace = true }
language-pack-es-es = { workspace = true }
learning-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
semver = "1"
thiserror = { workspace = true }
application = { workspace = true }
adaptation = { workspace = true }
review-engine = { workspace = true }
tutor-contract = { workspace = true }
uuid = { version = "1", features = ["v4", "js"] }

[lints]
workspace = true
