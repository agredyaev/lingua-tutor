name: Release Assets

on:
  workflow_call:
    inputs:
      tag:
        description: Existing Release Please tag whose tested CI artifacts should be published
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release Please tag whose tested CI artifacts should be published
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve tested CI run for release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          ref_json="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")"
          sha="$(jq -r '.object.sha' <<< "$ref_json")"
          type="$(jq -r '.object.type' <<< "$ref_json")"
          if [[ "$type" == "tag" ]]; then
            tag_json="$(gh api "repos/$GH_REPO/git/tags/$sha")"
            sha="$(jq -r '.object.sha' <<< "$tag_json")"
          fi

          version_file="$(gh api "repos/$GH_REPO/contents/VERSION?ref=$sha" --jq .content | tr -d '\n' | base64 --decode | tr -d '[:space:]')"
          if [[ -z "$version_file" || "$TAG" != "v$version_file" ]]; then
            echo "::error::Release tag $TAG does not match VERSION $version_file."
            exit 1
          fi

          runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20")"
          run_id="$(jq -r '
            .workflow_runs
            | map(select(.status == "completed" and .conclusion == "success"))
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ' <<< "$runs")"

          if [[ -z "$run_id" ]]; then
            echo "::error::No successful CI run found for release commit $sha."
            exit 1
          fi

          artifact="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "lingua-tutor-release-assets" and .expired == false) | .id' | head -n1)"
          if [[ -z "$artifact" ]]; then
            echo "::error::CI run $run_id has no lingua-tutor-release-assets artifact."
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GH_REPO" --name lingua-tutor-release-assets --dir dist

      - name: Verify and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          expected=(
            "lingua-tutor-v$version-linux-x64.zip"
            "lingua-tutor-v$version-linux-aarch64.zip"
            "lingua-tutor-v$version-darwin-arm64.zip"
            SHA256SUMS
          )
          for asset in "${expected[@]}"; do
            test -f "dist/$asset"
          done

          expected_list="$(printf '%s\n' "${expected[@]}" | sort)"
          actual_list="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$actual_list" = "$expected_list"

          (cd dist && sha256sum -c SHA256SUMS)
          for archive in dist/lingua-tutor-*.zip; do
            test "$(unzip -Z1 "$archive")" = "lingua-tutor"
            verify_dir="$(mktemp -d)"
            unzip -q "$archive" -d "$verify_dir"
            test -x "$verify_dir/lingua-tutor"
          done

          gh release upload "$TAG" dist/lingua-tutor-*.zip dist/SHA256SUMS --repo "$GH_REPO" --clobber

          release_assets="$(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | sort)"
          test "$release_assets" = "$expected_list"

          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"
