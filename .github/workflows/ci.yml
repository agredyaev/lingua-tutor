name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14,cargo-deny@0.20.2

      - name: Documentation contract
        shell: bash
        run: |
          set -euo pipefail

          user_docs=(README.md docs/installation.md docs/local-runtime.md)
          if grep -nE 'cargo[[:space:]]+install' "${user_docs[@]}"; then
            echo "End-user documentation must install from release binaries, not Cargo." >&2
            exit 1
          fi

          grep -Fq 'lingua-tutor-vX.Y.Z-darwin-arm64.zip' docs/installation.md
          grep -Fq 'lingua-tutor-vX.Y.Z-linux-x64.zip' docs/installation.md
          grep -Fq 'lingua-tutor-vX.Y.Z-linux-aarch64.zip' docs/installation.md
          grep -Fq 'SHA256SUMS' README.md
          grep -Fq 'SHA256SUMS' docs/installation.md

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Build web
        working-directory: apps/web
        run: trunk build --release --cargo-profile wasm-release

      - name: Cargo deny
        run: cargo deny --locked check

  prepare-release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      stage: ${{ steps.release.outputs.stage }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/local/Cargo.toml | head -n1)"
          test -n "$version"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "stage=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | @base64" | head -n1 || true)"
          if [[ -n "$existing" ]]; then
            release_json="$(printf '%s' "$existing" | base64 --decode)"
            release_id="$(jq -r .id <<< "$release_json")"
            draft="$(jq -r .draft <<< "$release_json")"
            target="$(jq -r .target_commitish <<< "$release_json")"

            if [[ "$draft" != "true" ]]; then
              echo "Published release $tag already exists; skipping release staging."
              echo "stage=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$target" != "$SHA" ]]; then
              gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
              existing=""
            fi
          fi

          if [[ -z "$existing" ]]; then
            gh release create "$tag"               --repo "$GH_REPO"               --target "$SHA"               --title "$tag"               --generate-notes               --draft
          fi

          echo "stage=true" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Build embedded web assets
        working-directory: apps/web
        run: trunk build --release --cargo-profile wasm-release

      - name: Build native release binary
        run: cargo build --locked --release -p lingua-tutor-local --bin lingua-tutor

      - name: Smoke native binary
        shell: bash
        run: |
          set -euo pipefail
          target/release/lingua-tutor --help

          workspace="$(mktemp -d)"
          log="$workspace/runtime.log"
          (
            cd "$workspace"
            "$GITHUB_WORKSPACE/target/release/lingua-tutor" run --no-tunnel --port 18787 >"$log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT

            ready=0
            for _ in {1..30}; do
              if curl -fsS http://127.0.0.1:18787/ >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "$ready" != 1 ]]; then
              cat "$log"
              exit 1
            fi

            test -s .lingua-tutor/web/index.html
            response="$(curl -fsS               -H 'Content-Type: application/json'               -d '{"jsonrpc":"2.0","id":1,"method":"health","params":{}}'               http://127.0.0.1:18787/rpc)"
            grep -Fq '"result"' <<< "$response"
          )

      - if: runner.os == 'macOS'
        name: Build macOS arm64 binary
        run: |
          rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-apple-darwin
          cargo build --locked --release -p lingua-tutor-local --bin lingua-tutor --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/lingua-tutor | grep -Eq 'Mach-O 64-bit executable arm64'

      - if: runner.os == 'macOS' && needs.prepare-release.outputs.stage == 'true'
        name: Stage macOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          cp target/aarch64-apple-darwin/release/lingua-tutor "$package_dir/lingua-tutor"
          chmod +x "$package_dir/lingua-tutor"
          asset="$GITHUB_WORKSPACE/lingua-tutor-v$VERSION-darwin-arm64.zip"
          (cd "$package_dir" && zip -q "$asset" lingua-tutor)
          test "$(unzip -Z1 "$asset")" = "lingua-tutor"
          verify_dir="$(mktemp -d)"
          unzip -q "$asset" -d "$verify_dir"
          test -x "$verify_dir/lingua-tutor"
          gh release upload "$TAG" "$asset" --repo "$GH_REPO" --clobber

  cross:
    needs: [checks, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Build embedded web assets
        working-directory: apps/web
        run: trunk build --release --cargo-profile wasm-release

      - name: Install cross toolchain
        run: python3 -m pip install cargo-zigbuild==0.23.4 ziglang==0.17.0

      - name: Build Linux release binaries
        run: |
          export PATH="$(python3 -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent)'):$PATH"
          test "$(zig version)" = "0.17.0"
          cargo zigbuild --locked --release -p lingua-tutor-local --bin lingua-tutor             --target x86_64-unknown-linux-gnu             --target aarch64-unknown-linux-gnu

      - name: Verify Linux binaries
        run: |
          file target/x86_64-unknown-linux-gnu/release/lingua-tutor | grep -Eq 'ELF 64-bit.*x86-64'
          file target/aarch64-unknown-linux-gnu/release/lingua-tutor | grep -Eq 'ELF 64-bit.*ARM aarch64'
          target/x86_64-unknown-linux-gnu/release/lingua-tutor --help

      - if: needs.prepare-release.outputs.stage == 'true'
        name: Stage Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail

          package() {
            binary="$1"
            asset="$2"
            package_dir="$(mktemp -d)"
            cp "$binary" "$package_dir/lingua-tutor"
            chmod +x "$package_dir/lingua-tutor"
            (cd "$package_dir" && zip -q "$GITHUB_WORKSPACE/$asset" lingua-tutor)
            test "$(unzip -Z1 "$GITHUB_WORKSPACE/$asset")" = "lingua-tutor"
            verify_dir="$(mktemp -d)"
            unzip -q "$GITHUB_WORKSPACE/$asset" -d "$verify_dir"
            test -x "$verify_dir/lingua-tutor"
          }

          package target/x86_64-unknown-linux-gnu/release/lingua-tutor             "lingua-tutor-v$VERSION-linux-x64.zip"
          package target/aarch64-unknown-linux-gnu/release/lingua-tutor             "lingua-tutor-v$VERSION-linux-aarch64.zip"

          gh release upload "$TAG"             "lingua-tutor-v$VERSION-linux-x64.zip"             "lingua-tutor-v$VERSION-linux-aarch64.zip"             --repo "$GH_REPO"             --clobber

  release-assets:
    needs: [prepare-release, build, cross]
    if: needs.prepare-release.outputs.stage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify staged assets and add checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG"             --repo "$GH_REPO"             --pattern 'lingua-tutor-*.zip'             --dir dist

          expected="$(printf '%s\n'             "lingua-tutor-v$VERSION-darwin-arm64.zip"             "lingua-tutor-v$VERSION-linux-aarch64.zip"             "lingua-tutor-v$VERSION-linux-x64.zip" | sort)"
          actual="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$actual" = "$expected"

          for archive in dist/lingua-tutor-*.zip; do
            test "$(unzip -Z1 "$archive")" = "lingua-tutor"
            verify_dir="$(mktemp -d)"
            unzip -q "$archive" -d "$verify_dir"
            test -x "$verify_dir/lingua-tutor"
          done

          (cd dist && sha256sum lingua-tutor-*.zip > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          gh release upload "$TAG" dist/SHA256SUMS --repo "$GH_REPO" --clobber

          expected_with_sums="$(printf '%s\n' SHA256SUMS "$expected" | sort)"
          published="$(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | sort)"
          test "$published" = "$expected_with_sums"
