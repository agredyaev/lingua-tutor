name: Android APK

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release_web_assets:
        type: boolean
        default: false
      release_signed:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.release_web_assets }}
        with:
          name: release-web-assets
          path: apps/web/dist
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        if: ${{ !inputs.release_web_assets }}
        with:
          tool: trunk@0.21.14
      - name: Build embedded web assets
        if: ${{ !inputs.release_web_assets }}
        working-directory: apps/web
        run: trunk build --release --cargo-profile wasm-release

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build and sign test APK
        if: ${{ !inputs.release_signed }}
        run: |
          set -euo pipefail
          export ANDROID_TEST_BUILD=1
          export ANDROID_SIGNING_KEYSTORE="$RUNNER_TEMP/android-ci.p12"
          export ANDROID_SIGNING_ALIAS=android-ci
          export ANDROID_SIGNING_STORE_PASSWORD=android-ci-test-only
          export ANDROID_SIGNING_KEY_PASSWORD="$ANDROID_SIGNING_STORE_PASSWORD"
          keytool -genkeypair -keystore "$ANDROID_SIGNING_KEYSTORE" -storetype PKCS12 \
            -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Lingua Tutor CI test'
          bash scripts/build-android.sh

      - name: Build and sign release APK
        if: ${{ inputs.release_signed }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Configure the persistent Android release signing key}"
          export ANDROID_SIGNING_KEYSTORE="$RUNNER_TEMP/android-release.keystore"
          umask 077
          trap 'rm -f "$ANDROID_SIGNING_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_KEYSTORE"
          unset KEYSTORE_BASE64
          bash scripts/build-android.sh

      - name: Exercise the test-signed APK on Android
        if: ${{ !inputs.release_signed }}
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          bash tests/android/run_acceptance.sh "dist-android/lingua-tutor-$tag-android.apk" "$tag"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && !inputs.release_signed }}
        with:
          name: android-ci-acceptance-evidence
          path: ${{ runner.temp }}/android-evidence/
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: dist-android/*.apk
          if-no-files-found: error
