name: e2e

# Browser suite (12-testing.md §7): required on pull requests and main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: stable-linux
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: trunk@0.21.14
      - name: Build web
        working-directory: apps/web
        run: trunk build --release --cargo-profile wasm-release
      - name: Build native server
        run: cargo build --locked -p lingua-tutor-local --bin lingua-tutor
      - name: Install Playwright package
        working-directory: tests/e2e
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: tests/e2e
        run: npx playwright test
