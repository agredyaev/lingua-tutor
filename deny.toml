# Supply-chain policy (02-workspace.md §4). CI gate: cargo deny check.

[advisories]
yanked = "deny"
ignore = [
    # paste unmaintained; transitive via leptos macros. Revisit on leptos bump.
    "RUSTSEC-2024-0436",
    # proc-macro-error2 unmaintained; transitive via rstml/leptos_macro. Same.
    "RUSTSEC-2026-0173",
    # Marvin timing attack applies to RSA private-key operations; the Worker
    # only VERIFIES Access JWTs with public keys — no private key exists here.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0", # xxhash-rust, transitive via leptos hashing
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps carry no version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
