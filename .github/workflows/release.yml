name: Release

on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Main commit to release; defaults to current main
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve release commit and version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          sha="${WORKFLOW_SHA:-${INPUT_SHA:-$main_sha}}"

          if [[ "$sha" != "$main_sha" ]]; then
            echo "Current main moved from $sha to $main_sha; skipping stale release candidate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cargo_toml="$(gh api "repos/$GH_REPO/contents/apps/local/Cargo.toml?ref=$sha" --jq .content | tr -d '\n' | base64 --decode)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' <<< "$cargo_toml" | head -n1)"
          test -n "$version"
          tag="v$version"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the same commit
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in {1..90}; do
            runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20")"
            status="$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].status // empty' <<< "$runs")"
            conclusion="$(jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].conclusion // empty' <<< "$runs")"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::CI completed with $conclusion for $SHA."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done

          echo "::error::CI did not complete for $SHA."
          exit 1

      - name: Verify draft assets
        if: steps.release.outputs.skip != 'true'
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\")" | head -n1)"
          test -n "$release_json"

          release_id="$(jq -r .id <<< "$release_json")"
          draft="$(jq -r .draft <<< "$release_json")"
          target="$(jq -r .target_commitish <<< "$release_json")"
          test "$draft" = "true"
          test "$target" = "$SHA"

          expected="$(printf '%s\n'             SHA256SUMS             "lingua-tutor-v$VERSION-darwin-arm64.zip"             "lingua-tutor-v$VERSION-linux-aarch64.zip"             "lingua-tutor-v$VERSION-linux-x64.zip" | sort)"
          published="$(jq -r '.assets[].name' <<< "$release_json" | sort)"
          test "$published" = "$expected"

          mkdir -p dist
          gh release download "$TAG" --repo "$GH_REPO" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Publish verified draft
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail

          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID"             -F draft=false             -f make_latest=true >/dev/null

          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          test "$tag_sha" = "$SHA"

          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          test "$latest" = "$TAG"
