[workspace]
resolver = "2"
members = [
    "apps/web",
    "apps/worker",
    "crates/language-pack-api",
    "crates/language-pack-registry",
    "crates/shared-schema",
    "language-packs/es-es",
    "language-packs/synthetic-test-pack",
    "tests",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
shared-schema = { path = "crates/shared-schema" }
language-pack-api = { path = "crates/language-pack-api" }
language-pack-registry = { path = "crates/language-pack-registry" }
language-pack-es-es = { path = "language-packs/es-es" }
synthetic-test-pack = { path = "language-packs/synthetic-test-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
leptos = "0.8.20"
worker = "0.8.5"

[workspace.lints.rust]
missing_docs = "warn" # "deny" after M2 exit gate (17-documentation.md §1)
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn" # allow-listed with invariant comment
panic = "warn"
cognitive_complexity = "warn"

# Trunk release builds use this profile (09-frontend.md §9); 3 MB compressed budget.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
