name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-linux
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Cargo deny
        run: cargo deny --locked check

      - name: Release version consistency
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' apps/local/Cargo.toml | head -n1)"
          lock_version="$(sed -n '/^name = "lingua-tutor-local"$/ { n; s/^version = "\([^"]*\)".*/\1/p; q; }' Cargo.lock)"
          printf 'VERSION=%s Cargo.toml=%s Cargo.lock=%s\n' "$version" "$cargo_version" "$lock_version"
          test -n "$version"
          test "$version" = "$cargo_version"
          test "$version" = "$lock_version"

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-windows

      - name: Windows compile check
        run: cargo check --locked -p lingua-tutor-local --bin lingua-tutor
