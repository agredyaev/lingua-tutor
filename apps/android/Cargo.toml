[package]
name = "lingua-tutor-android"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
lingua-tutor-local = { path = "../local" }
jni = { version = "0.21.1", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time"] }

# JNI export symbols require unsafe(no_mangle); no unsafe blocks are used.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
