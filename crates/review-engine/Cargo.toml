[package]
name = "review-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ReviewScheduler trait, FSRS adapter, fallback scheduler (05-review-engine.md)"

[dependencies]
# fsrs types never leave this crate (05-review-engine.md §1).
fsrs = "6.6.1"
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Backend selection for the transitive getrandom dep (.cargo/config.toml).
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
