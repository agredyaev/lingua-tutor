# Supply-chain policy (02-workspace.md §4). CI gate: cargo deny check.

[advisories]
yanked = "deny"
ignore = [
    # paste unmaintained; transitive via leptos macros. Revisit on leptos bump.
    "RUSTSEC-2024-0436",
    # proc-macro-error2 unmaintained; transitive via rstml/leptos_macro. Same.
    "RUSTSEC-2026-0173",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0", # xxhash-rust, transitive via leptos hashing
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path deps carry no version
# Known cross-major transitive duplicates — not unifiable from this workspace.
# Skips pin the OLD version: they fall out on their own once upstreams migrate,
# and any NEW duplicate still warns. Revisit on major dep bumps.
skip = [
    { crate = "convert_case@0.6.0" },
    { crate = "cpufeatures@0.2.17" },
    { crate = "getrandom@0.3.4" },
    { crate = "hashbrown@0.15.5" },
    { crate = "r-efi@5.3.0" },
    { crate = "rand@0.9.5" },
    { crate = "rand_core@0.9.5" },
    { crate = "thiserror@1.0.69" },
    { crate = "thiserror-impl@1.0.69" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
