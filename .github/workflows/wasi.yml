name: WASI Preview 3

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release_web_assets:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip3,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasi-p3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.release_web_assets }}
        with:
          name: release-web-assets
          path: apps/web/dist
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        if: ${{ !inputs.release_web_assets }}
        with:
          tool: trunk@0.21.14
      - name: Build embedded web assets
        if: ${{ !inputs.release_web_assets }}
        working-directory: apps/web
        env:
          RUSTUP_TOOLCHAIN: 1.100.0
        run: trunk build --release --cargo-profile wasm-release

      - name: Install validated WASI SDK and Wasmtime
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          sdk=wasi-sdk-34.0-x86_64-linux
          runtime=wasmtime-v51.0.0-x86_64-linux
          curl -fsSLO "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$sdk.tar.gz"
          curl -fsSLO "https://github.com/bytecodealliance/wasmtime/releases/download/v51.0.0/$runtime.tar.xz"
          sha256sum -c <<CHECKSUMS
          b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $sdk.tar.gz
          a18020674fac4107f329bc9ed720ea9c88e4b30a61e8a527787bcce051123d32  $runtime.tar.xz
          CHECKSUMS
          tar -xf "$sdk.tar.gz"
          tar -xf "$runtime.tar.xz"
          echo "WASI_SDK_PATH=$PWD/$sdk" >> "$GITHUB_ENV"
          echo "$PWD/$runtime" >> "$GITHUB_PATH"

      - name: Build and test WASI component
        run: scripts/build-wasi.sh test

      - name: Smoke-test the release component and embedded UI
        run: |
          set -euo pipefail
          state="$(mktemp -d)"
          component="dist-wasi/lingua-tutor-v$(cat VERSION)-wasi-p3.wasm"
          wasmtime run -S p3=y -S inherit-network=y -S allow-ip-name-lookup=y \
            --dir "$state::." "$component" run --port 18787 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            http://127.0.0.1:18787/setup -o "$state/setup.html"
          grep -Fq 'Lingua Tutor' "$state/setup.html"
          wasm_path="$(sed -n "s/.*module_or_path: '\([^']*\)'.*/\1/p" "$state/setup.html")"
          test -n "$wasm_path"
          curl -fsS "http://127.0.0.1:18787$wasm_path" -o "$state/web.wasm"
          test "$(od -An -tx1 -N4 "$state/web.wasm" | tr -d ' \n')" = 0061736d
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"health","params":{}}' http://127.0.0.1:18787/rpc \
            | jq -e '.result.sqlite_connected == true'
          test -s "$state/.lingua-tutor/lingua.sqlite3"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasi-p3
          path: dist-wasi/*.wasm
          if-no-files-found: error
